<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авиадиспетчер — симулятор ATC</title>
<style>
  body {
    margin: 0;
    background: #0b0e0b;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12px;
  }
  canvas {
    display: block;
    max-width: 100%;
    border: 1px solid #1d5c33;
    background: #020602;
    user-select: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1000" height="784"></canvas>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;          // 1000
const HUD_H = 34;                // верхняя строка статистики
const RH = 600;                  // высота радара
const PANEL_Y = HUD_H + RH;      // 634 — начало панели управления
const PANEL_H = 150;
const CH = PANEL_Y + PANEL_H;    // 784 — общая высота канвы

const RWY = { x1: 420, x2: 580, y: 300, hdg: 0 };
const AIRPORT = { x: (RWY.x1 + RWY.x2) / 2, y: RWY.y };

const TURN_RATE = 60;
const CLIMB_RATE = 2200;
const ACCEL = 20;
const PX_PER_KT = 0.5;
const MIN_SEP = 28;
const WARN_SEP = 55;
const VERT_SEP = 1000;

const PREFIXES = ['AFL', 'S7', 'UTA', 'VKO', 'SVO', 'NORD', 'AERO', 'URAL', 'POB', 'GOS'];

const G = {
  state: 'menu',
  planes: [],
  effects: [],
  toasts: [],
  selected: null,
  score: 0,
  best: parseInt(localStorage.getItem('atc_best') || '0', 10),
  landed: 0,
  missed: 0,
  lives: 3,
  streak: 0,
  time: 0,
  level: 1,
  spawnT: 3,
  overReason: '',
  conflicts: new Set(),
  lastWarnBeep: 0,
  nextId: 1,
};

let muted = false;
let actx = null;
let mouse = { x: -1, y: -1 };

function beep(freq, dur, type, vol) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    o.connect(g);
    g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (e) { /* звук недоступен */ }
}

function chime() { beep(660, 0.12, 'sine', 0.06); setTimeout(() => beep(880, 0.2, 'sine', 0.06), 120); }

function norm(a) { a %= 360; return a < 0 ? a + 360 : a; }
function angDiff(a, b) { let d = (a - b) % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function angTo(p, t) { return norm(Math.atan2(t.y - p.y, t.x - p.x) * 180 / Math.PI); }

function toast(text, cls) {
  G.toasts.push({ text, cls: cls || 'info', t0: performance.now() });
  if (G.toasts.length > 5) G.toasts.shift();
}

function reset() {
  G.planes = [];
  G.effects = [];
  G.toasts = [];
  G.selected = null;
  G.score = 0;
  G.landed = 0;
  G.missed = 0;
  G.lives = 3;
  G.streak = 0;
  G.time = 0;
  G.level = 1;
  G.spawnT = 2.5;
  G.overReason = '';
  G.conflicts = new Set();
  G.nextId = 1;
}

function start() {
  reset();
  G.state = 'playing';
  toast('Смена началась. Удачи, диспетчер!', 'ok');
  beep(520, 0.15, 'sine', 0.05);
}

function gameOver(reason) {
  G.state = 'over';
  G.overReason = reason;
  if (G.score > G.best) {
    G.best = G.score;
    localStorage.setItem('atc_best', String(G.best));
  }
  beep(90, 0.9, 'sawtooth', 0.12);
  toast('Конец игры: ' + reason, 'bad');
}

function spawnPlane() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = -30; y = 40 + Math.random() * (RH - 80); }
  else if (edge === 1) { x = W + 30; y = 40 + Math.random() * (RH - 80); }
  else if (edge === 2) { x = 40 + Math.random() * (W - 80); y = -30; }
  else { x = 40 + Math.random() * (W - 80); y = RH + 30; }

  const hdg = norm(angTo({ x, y }, AIRPORT) + (Math.random() * 40 - 20));
  const alt = Math.round((6000 + Math.random() * 14000) / 1000) * 1000;
  const spd = 160 + Math.floor(Math.random() * 80);
  const cs = PREFIXES[Math.floor(Math.random() * PREFIXES.length)] + (100 + Math.floor(Math.random() * 900));

  G.planes.push({
    id: G.nextId++,
    cs,
    x, y, hdg,
    alt, targetAlt: alt,
    spd, targetSpd: spd,
    state: 'inbound',
    vec: null,
  });
}

function selectedPlane() {
  return G.planes.find(p => p.id === G.selected) || null;
}

function cmdAlt(d) {
  const p = selectedPlane();
  if (!p || p.state !== 'inbound') return;
  p.targetAlt = clamp(p.targetAlt + d, 500, 40000);
  beep(440, 0.05, 'square', 0.03);
}

function cmdSpd(d) {
  const p = selectedPlane();
  if (!p || p.state !== 'inbound') return;
  p.targetSpd = clamp(p.targetSpd + d, 120, 320);
  beep(440, 0.05, 'square', 0.03);
}

function cmdVector(x, y) {
  const p = selectedPlane();
  if (!p || p.state !== 'inbound') return;
  p.vec = { x, y };
}

function canLand(p) {
  if (p.state !== 'inbound') return { ok: false, why: 'уже не в заходе' };
  if (Math.abs(angDiff(p.hdg, RWY.hdg)) > 30) return { ok: false, why: 'не на курсе полосы (нужен курс на восток)' };
  if (Math.abs(p.y - RWY.y) > 40) return { ok: false, why: 'далеко от оси полосы' };
  if (p.x > RWY.x1 + 20) return { ok: false, why: 'пролетел начало полосы' };
  if (p.x < RWY.x1 - 600) return { ok: false, why: 'слишком далеко от полосы' };
  if (p.alt > 3500) return { ok: false, why: 'слишком высоко (' + p.alt + ' футов)' };
  if (p.spd > 210) return { ok: false, why: 'слишком быстро (' + Math.round(p.spd) + ' узлов)' };
  return { ok: true };
}

function cmdLand() {
  const p = selectedPlane();
  if (!p) { toast('Сначала выбери самолёт', 'bad'); return; }
  const r = canLand(p);
  if (!r.ok) { toast(p.cs + ': невозможно — ' + r.why, 'bad'); beep(180, 0.2, 'sawtooth', 0.05); return; }
  p.state = 'landing';
  p.vec = null;
  toast(p.cs + ' допущен к посадке на RWY 09', 'ok');
  chime();
}

function landSuccess(p) {
  G.landed++;
  G.streak++;
  const bonus = Math.min(G.streak, 10) * 5;
  G.score += 100 + bonus;
  G.effects.push({ x: p.x, y: p.y, t: 0, type: 'land' });
  toast(p.cs + ' сел. +' + (100 + bonus) + ' очков', 'ok');
  chime();
  if (G.landed % 5 === 0) {
    G.score += 250;
    toast('Отличная смена! Бонус +250', 'ok');
  }
  removePlane(p);
}

function goAround(p) {
  p.state = 'gone';
  p.targetAlt = 4000;
  p.targetSpd = 200;
  p.vec = { x: W + 120, y: p.y };
  miss(p.cs + ' ушёл на второй круг');
}

function miss(text) {
  G.missed++;
  G.lives--;
  G.streak = 0;
  toast(text + ' — минус жизнь', 'bad');
  beep(200, 0.3, 'sawtooth', 0.07);
  if (G.lives <= 0) gameOver('Слишком много пропущенных рейсов');
}

function removePlane(p) {
  if (G.selected === p.id) G.selected = null;
  G.planes = G.planes.filter(q => q !== p);
}

function update(dt) {
  if (G.state !== 'playing') return;

  G.time += dt;
  G.level = 1 + Math.floor(G.time / 30);

  const interval = Math.max(2.4, 7.5 - G.level * 0.9);
  const maxPlanes = Math.min(14, 4 + G.level * 2);
  G.spawnT -= dt;
  const active = G.planes.filter(p => p.state === 'inbound' || p.state === 'landing').length;
  if (G.spawnT <= 0 && active < maxPlanes) {
    spawnPlane();
    G.spawnT = interval * (0.7 + Math.random() * 0.6);
  }

  for (const p of G.planes) {
    if (p.state === 'inbound' && p.vec) {
      const want = angTo(p, p.vec);
      const d = angDiff(want, p.hdg);
      const step = TURN_RATE * dt;
      p.hdg = norm(p.hdg + clamp(d, -step, step));
      if (Math.hypot(p.vec.x - p.x, p.vec.y - p.y) < 15) p.vec = null;
    } else if (p.state === 'landing') {
      const want = angTo(p, { x: RWY.x1 + 50, y: RWY.y });
      const d = angDiff(want, p.hdg);
      const step = 70 * dt;
      p.hdg = norm(p.hdg + clamp(d, -step, step));
      p.targetAlt = 0;
      p.targetSpd = p.alt > 500 ? 150 : 120;
    }

    const vertRate = p.state === 'landing' ? 800 : CLIMB_RATE;
    p.alt += clamp(p.targetAlt - p.alt, -vertRate * dt, vertRate * dt);
    p.spd += clamp(p.targetSpd - p.spd, -ACCEL * dt, ACCEL * dt);

    const rad = p.hdg * Math.PI / 180;
    p.x += Math.cos(rad) * p.spd * PX_PER_KT * dt;
    p.y += Math.sin(rad) * p.spd * PX_PER_KT * dt;

    if (p.state === 'landing') {
      if (p.alt <= 0) {
        p.alt = 0;
        if (p.x >= RWY.x1 - 20 && p.x <= RWY.x2 + 20) landSuccess(p);
        else goAround(p);
      } else if (p.x > RWY.x2 + 120) {
        goAround(p);
      }
    }

    if (p.x < -80 || p.x > W + 80 || p.y < -80 || p.y > RH + 80) {
      if (p.state === 'inbound') miss(p.cs + ' вышел из зоны без посадки');
      removePlane(p);
    }
  }

  G.conflicts.clear();
  for (let i = 0; i < G.planes.length; i++) {
    for (let j = i + 1; j < G.planes.length; j++) {
      const a = G.planes[i], b = G.planes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.hypot(dx, dy);
      if (Math.abs(a.alt - b.alt) < VERT_SEP) {
        if (dist < MIN_SEP) {
          gameOver('Столкновение в воздухе: ' + a.cs + ' и ' + b.cs);
          return;
        }
        if (dist < WARN_SEP) {
          G.conflicts.add(a.id < b.id ? a.id + ':' + b.id : b.id + ':' + a.id);
        }
      }
    }
  }
  if (G.conflicts.size > 0 && G.time - G.lastWarnBeep > 1.2) {
    G.lastWarnBeep = G.time;
    beep(240, 0.12, 'sawtooth', 0.06);
    toast('⚠ Конфликт! Разведите борта по высоте или курсу', 'bad');
  }

  for (const e of G.effects) e.t += dt;
  G.effects = G.effects.filter(e => e.t < 1);
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(60, 255, 130, 0.10)';
  ctx.lineWidth = 1;
  for (let r = 100; r <= 500; r += 100) {
    ctx.beginPath();
    ctx.arc(AIRPORT.x, AIRPORT.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(60, 255, 130, 0.06)';
  for (let a = 0; a < 360; a += 30) {
    const rad = a * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(AIRPORT.x, AIRPORT.y);
    ctx.lineTo(AIRPORT.x + Math.cos(rad) * 520, AIRPORT.y + Math.sin(rad) * 520);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(120, 255, 170, 0.45)';
  ctx.font = '12px monospace';
  ctx.fillText('N', AIRPORT.x - 3, 16);
  ctx.fillText('S', AIRPORT.x - 3, RH - 6);
  ctx.fillText('W', 6, AIRPORT.y - 6);
  ctx.fillText('E', W - 14, AIRPORT.y - 6);
  ctx.fillStyle = 'rgba(120, 255, 170, 0.3)';
  ctx.font = '10px monospace';
  for (let r = 100; r <= 500; r += 100) ctx.fillText((r / 20) + 'NM', AIRPORT.x + r + 3, AIRPORT.y - 3);
}

function drawRunway() {
  const { x1, x2, y } = RWY;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x1 - 8, y - 7, (x2 - x1) + 16, 14);
  ctx.strokeStyle = '#cfcfcf';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x1 - 8, y - 7, (x2 - x1) + 16, 14);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#cfcfcf';
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(x1 + 2 + i * 5, y - 5, 2, 10);
    ctx.fillRect(x2 - 4 - i * 5, y - 5, 2, 10);
  }
  ctx.fillStyle = 'rgba(200,255,215,0.8)';
  ctx.font = '11px monospace';
  ctx.fillText('RWY 09', x1 - 8, y - 14);
  ctx.fillText('► посадка на восток', x2 + 12, y + 4);
}

function planeConflict(id) {
  for (const key of G.conflicts) {
    const parts = key.split(':');
    if (parseInt(parts[0], 10) === id || parseInt(parts[1], 10) === id) return true;
  }
  return false;
}

function drawPlane(p) {
  const isSel = G.selected === p.id;
  const inConflict = planeConflict(p.id);
  const blink = inConflict && Math.floor(G.time * 4) % 2 === 0;

  let color = '#3aff6e';
  if (p.state === 'landing') color = '#ffd23a';
  if (inConflict) color = blink ? '#ff2020' : '#ff8080';
  if (isSel) color = '#ffffff';

  if (isSel && p.vec && p.state === 'inbound') {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.vec.x, p.vec.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(p.vec.x, p.vec.y, 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (p.state === 'landing') {
    ctx.strokeStyle = 'rgba(255,210,58,0.35)';
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(RWY.x1 + 50, RWY.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.hdg * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(11, 0);
  ctx.lineTo(-8, -6);
  ctx.lineTo(-4, 0);
  ctx.lineTo(-8, 6);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();

  if (isSel) {
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.font = '10px monospace';
  ctx.fillStyle = color;
  const fl = Math.round(p.alt / 100);
  const line1 = p.cs;
  const line2 = isSel
    ? 'FL' + fl + '→' + Math.round(p.targetAlt / 100) + ' ' + Math.round(p.spd) + '→' + Math.round(p.targetSpd) + 'kt'
    : 'FL' + fl + ' ' + Math.round(p.spd) + 'kt';
  ctx.fillText(line1, p.x + 15, p.y - 8);
  ctx.fillText(line2, p.x + 15, p.y + 3);
}

function drawEffects() {
  for (const e of G.effects) {
    const a = 1 - e.t;
    ctx.strokeStyle = 'rgba(94, 255, 138, ' + a.toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 8 + e.t * 40, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawToasts() {
  const now = performance.now();
  G.toasts = G.toasts.filter(t => now - t.t0 < 4200);
  ctx.font = '13px monospace';
  G.toasts.forEach((t, i) => {
    const alpha = clamp(1 - (now - t.t0) / 4000, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.cls === 'ok' ? '#5eff8a' : t.cls === 'bad' ? '#ff6b6b' : '#8fd0ff';
    ctx.fillText(t.text, 10, RH - 14 - (G.toasts.length - 1 - i) * 17);
  });
  ctx.globalAlpha = 1;
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function drawHUD() {
  ctx.fillStyle = '#04140a';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.strokeStyle = '#1d5c33';
  ctx.beginPath();
  ctx.moveTo(0, HUD_H - 0.5);
  ctx.lineTo(W, HUD_H - 0.5);
  ctx.stroke();
  ctx.font = '13px monospace';
  const items = [
    ['СЧЁТ: ', G.score, 10, '#5eff8a'],
    ['ПОСАЖЕНО: ', G.landed, 120, '#5eff8a'],
    ['ПРОПУЩЕНО: ', G.missed, 250, '#5eff8a'],
    ['ЖИЗНИ: ', G.lives > 0 ? '♥'.repeat(G.lives) : '—', 380, G.lives <= 1 ? '#ff5a5a' : '#5eff8a'],
    ['ВРЕМЯ: ', fmtTime(G.time), 480, '#5eff8a'],
    ['УРОВЕНЬ: ', G.level, 580, '#5eff8a'],
    ['БОРТОВ: ', G.planes.length, 680, '#5eff8a'],
    ['РЕКОРД: ', G.best, 790, '#ffd23a'],
  ];
  for (const [label, val, x, color] of items) {
    ctx.fillStyle = '#6fae83';
    ctx.fillText(label, x, 22);
    ctx.fillStyle = color;
    ctx.fillText(String(val), x + ctx.measureText(label).width + 4, 22);
  }
}

function hasInboundSelection() {
  const p = selectedPlane();
  return !!(p && p.state === 'inbound');
}

function togglePause() {
  if (G.state === 'playing' || G.state === 'paused') {
    G.state = G.state === 'playing' ? 'paused' : 'playing';
  }
}

function toggleMute() {
  muted = !muted;
  toast(muted ? 'Звук выключен' : 'Звук включён', 'info');
}

const BUTTON_DEFS = [
  { label: '▲ +1000 фт (W)', action: () => cmdAlt(1000), enabled: hasInboundSelection },
  { label: '▼ −1000 фт (S)', action: () => cmdAlt(-1000), enabled: hasInboundSelection },
  { label: '+10 узл (D)', action: () => cmdSpd(10), enabled: hasInboundSelection },
  { label: '−10 узл (A)', action: () => cmdSpd(-10), enabled: hasInboundSelection },
  { label: 'ПОСАДКА (L)', action: cmdLand, enabled: hasInboundSelection, accent: true },
  { label: () => G.state === 'paused' ? 'ДАЛЬШЕ (P)' : 'ПАУЗА (P)', action: togglePause, enabled: () => G.state === 'playing' || G.state === 'paused' },
  { label: 'ЗАНОВО (R)', action: start, enabled: () => true },
  { label: () => muted ? 'ЗВУК: выкл (M)' : 'ЗВУК: вкл (M)', action: toggleMute, enabled: () => true },
];

function buttonRects() {
  const gap = 6, bw = 117, bh = 30, y = PANEL_Y + 34, x0 = 10;
  return BUTTON_DEFS.map((b, i) => ({ def: b, x: x0 + i * (bw + gap), y, w: bw, h: bh }));
}

function drawPanel() {
  ctx.fillStyle = '#04140a';
  ctx.fillRect(0, PANEL_Y, W, PANEL_H);
  ctx.strokeStyle = '#1d5c33';
  ctx.beginPath();
  ctx.moveTo(0, PANEL_Y + 0.5);
  ctx.lineTo(W, PANEL_Y + 0.5);
  ctx.stroke();

  const p = selectedPlane();
  ctx.font = '13px monospace';
  ctx.fillStyle = '#ffe9a8';
  const selText = p
    ? p.cs + ' — высота ' + p.alt + ' фт (цель FL' + Math.round(p.targetAlt / 100) + '), ' +
      Math.round(p.spd) + ' узл (цель ' + Math.round(p.targetSpd) + '), состояние: ' +
      (p.state === 'inbound' ? 'на подходе' : p.state === 'landing' ? 'на посадке' : 'уходит')
    : 'Кликни по самолёту на радаре, чтобы выбрать его';
  ctx.fillText(selText, 10, PANEL_Y + 22);

  for (const r of buttonRects()) {
    const en = r.def.enabled();
    const hov = en && mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h;
    ctx.fillStyle = !en ? '#051a0d' : r.def.accent ? (hov ? '#4a3a0a' : '#2b2206') : (hov ? '#0a4423' : '#062b16');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = r.def.accent ? '#b8860b' : '#2c7a45';
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = !en ? '#3a5c46' : r.def.accent ? '#ffd23a' : '#7dffab';
    ctx.font = '13px monospace';
    const label = typeof r.def.label === 'function' ? r.def.label() : r.def.label;
    ctx.fillText(label, r.x + 8, r.y + 20);
  }

  ctx.fillStyle = '#6fae83';
  ctx.font = '11px monospace';
  ctx.fillText('Клик по борту — выбрать · клик по радару — вектор на точку · W/S — высота ±1000 · A/D — скорость ±10 · L — посадка · 1–9 — выбор борта', 10, PANEL_Y + 86);
  ctx.fillText('Цель: посадить на RWY 09 (заход с запада, курс на восток, ≤3500 фт, ≤210 узл). Столкновение — конец игры, пропуск — минус жизнь. P — пауза, R — заново, M — звук.', 10, PANEL_Y + 104);
}

function centerText(lines, y0, lineH, size, color) {
  ctx.font = size + 'px monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y0 + i * lineH));
  ctx.textAlign = 'left';
}

function drawMenu() {
  ctx.fillStyle = 'rgba(2, 6, 2, 0.82)';
  ctx.fillRect(0, 0, W, RH);
  centerText(['АВИАДИСПЕТЧЕР', 'симулятор управления воздушным движением'], 150, 34, 40, '#5eff8a');
  centerText([
    'Сажай прилетающие борта на полосу RWY 09 (подход с запада, курс на восток).',
    'Выбирай самолёт кликом, задавай курс кликом по радару, высоту и скорость — клавишами W/S и A/D.',
    'К посадке: на оси полосы, курс на восток, высота ≤ 3500 футов, скорость ≤ 210 узлов.',
    'Не допускай столкновений (дистанция < 28 и разница высот < 1000 футов).',
    '',
    'КЛИКНИ ПО РАДАРУ, ЧТОБЫ НАЧАТЬ СМЕНУ',
  ], 260, 24, 14, '#c8ffd8');
}

function drawPause() {
  ctx.fillStyle = 'rgba(2, 6, 2, 0.7)';
  ctx.fillRect(0, 0, W, RH);
  centerText(['ПАУЗА', 'P — продолжить'], 260, 30, 30, '#ffd23a');
}

function drawOver() {
  ctx.fillStyle = 'rgba(20, 2, 2, 0.85)';
  ctx.fillRect(0, 0, W, RH);
  centerText(['КОНЕЦ СМЕНЫ', G.overReason], 190, 32, 36, '#ff5a5a');
  centerText([
    'Счёт: ' + G.score + '   Посажено: ' + G.landed + '   Пропущено: ' + G.missed,
    'Рекорд: ' + G.best,
    '',
    'R или кнопка «ЗАНОВО» внизу — новая смена',
  ], 280, 24, 16, '#ffd9d9');
}

function draw() {
  ctx.fillStyle = '#020602';
  ctx.fillRect(0, 0, W, CH);

  drawHUD();

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HUD_H, W, RH);
  ctx.clip();
  ctx.translate(0, HUD_H);

  drawGrid();
  drawRunway();
  for (const p of G.planes) drawPlane(p);
  drawEffects();
  drawToasts();
  if (G.state === 'menu') drawMenu();
  else if (G.state === 'paused') drawPause();
  else if (G.state === 'over') drawOver();

  ctx.restore();
  drawPanel();
}

function canvasPos(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (CH / r.height) };
}

canvas.addEventListener('mousemove', ev => {
  mouse = canvasPos(ev);
  const overBtn = buttonRects().some(r => r.def.enabled() && mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h);
  canvas.style.cursor = overBtn ? 'pointer' : 'crosshair';
});

canvas.addEventListener('click', ev => {
  const pos = canvasPos(ev);

  if (pos.y >= PANEL_Y) {
    for (const r of buttonRects()) {
      if (r.def.enabled() && pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h) {
        r.def.action();
        return;
      }
    }
    return;
  }

  if (G.state === 'menu') { start(); return; }
  if (G.state !== 'playing') return;

  const rp = { x: pos.x, y: pos.y - HUD_H };
  let hit = null;
  for (const p of G.planes) {
    if (Math.hypot(p.x - rp.x, p.y - rp.y) < 16) { hit = p; break; }
  }
  if (hit) {
    G.selected = hit.id;
    beep(700, 0.04, 'square', 0.03);
  } else if (selectedPlane()) {
    cmdVector(rp.x, rp.y);
  } else {
    G.selected = null;
  }
});

document.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === ' ') { ev.preventDefault(); if (G.state === 'playing') cmdLand(); return; }
  if (k === 'enter' && G.state === 'menu') { start(); return; }
  if (k === 'r') { start(); return; }
  if (k === 'p') { togglePause(); return; }
  if (k === 'm') { toggleMute(); return; }
  if (G.state !== 'playing') return;
  if (k === 'w' || k === 'arrowup') cmdAlt(1000);
  else if (k === 's' || k === 'arrowdown') cmdAlt(-1000);
  else if (k === 'd' || k === 'arrowright') cmdSpd(10);
  else if (k === 'a' || k === 'arrowleft') cmdSpd(-10);
  else if (k === 'l') cmdLand();
  else if (k >= '1' && k <= '9') {
    const idx = parseInt(k, 10) - 1;
    if (G.planes[idx]) { G.selected = G.planes[idx].id; beep(700, 0.04, 'square', 0.03); }
  }
});

let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
